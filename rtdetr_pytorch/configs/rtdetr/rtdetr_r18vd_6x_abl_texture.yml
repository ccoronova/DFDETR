__include__: [
  '../dataset/coco_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetr_r50vd.yml',
]


# =============================================================
# Ablation: baseline + texture-aware module only
# Edge enhancer disabled (use_edge_enhancer=False), texture-aware module kept (use_texture_aware=True)
# Corresponds to the baseline+Texture Module combination requested by reviewer comment 10
# Dataset: PCB-DATASET (DATASET='pcb' in train.py)
# =============================================================
output_dir: outputs/rtdetr_r18vd_abl_texture


#pcb-mixpresent1
model: RTDETR
criterion: SetCriterion
postprocessor: RTDETRPostProcessor

RTDETR:
 backbone: PResNet
 encoder: HybridEncoder
 decoder: RTDETRTransformer
 scale: [640]

PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: False
  pretrained: True

HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5
  # Legacy AMSF ablation: texture-aware module only, edge enhancer / DADC / SWFD disabled (keeps the "baseline+texture" semantics)
  use_amsf: True
  use_edge_enhancer: False      # Edge enhancer disabled
  use_texture_aware: True       # Texture-aware module only
  use_dadc: False
  use_swfd: False


RTDETRTransformer:
  eval_idx: -1
  num_decoder_layers: 3
  num_denoising: 100


optimizer:
  type: AdamW
  params: 
    - 
      params: '^(?=.*backbone)(?=.*norm).*$'
      lr: 0.00005
      weight_decay: 0.
    - 
      params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.00005
    - 
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bias)).*$'
      weight_decay: 0.

  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.0005